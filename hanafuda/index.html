<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ffe4ee">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>はなふだ こいこい</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- タイトル -->
  <section id="title" class="screen active">
    <div class="title-box">
      <div class="title-art" id="titleArt"></div>
      <h1>はなふだ<br><span>こいこい</span></h1>
      <p class="sub">はなちゃんと しょうぶ！</p>

      <div class="setting">
        <div class="setting-label">あそぶ月の数</div>
        <div class="seg" data-key="rounds">
          <button data-v="3">3か月</button><button data-v="6">6か月</button><button data-v="12">12か月</button>
        </div>
      </div>
      <div class="setting">
        <div class="setting-label">はなちゃんの強さ</div>
        <div class="seg" data-key="level">
          <button data-v="easy">やさしい</button><button data-v="normal">ふつう</button>
        </div>
      </div>

      <button id="startBtn" class="btn primary big">あそぶ</button>
      <button id="howtoBtn" class="btn ghost">あそびかた・役</button>
    </div>
  </section>

  <!-- ゲーム -->
  <section id="game" class="screen">
    <header class="topbar">
      <div class="who cpu">
        <div class="avatar" id="cpuAvatar"></div>
        <div class="who-text">
          <div class="name">はなちゃん <span class="oya" id="cpuOya">親</span></div>
          <div class="pts"><b id="cpuScore">0</b>点 <span class="koi-badge" id="cpuKoi">こいこい中</span></div>
        </div>
      </div>
      <div class="cpu-hand" id="cpuHand"></div>
      <div class="round-box">
        <div id="roundLabel">1月</div>
        <button id="menuBtn" class="icon-btn" aria-label="メニュー">☰</button>
      </div>
    </header>

    <div class="captured" id="cpuCap" data-p="1"></div>

    <main class="mat" id="mat">
      <div class="pile">
        <div class="card back" id="deck"></div>
        <div class="stock-count" id="stockCount">24</div>
        <div class="draw-slot" id="drawSlot"></div>
      </div>
      <div class="field" id="field"></div>
    </main>

    <div class="captured" id="myCap" data-p="0"></div>

    <div class="mybar">
      <div class="who me">
        <div class="name">あなた <span class="oya" id="myOya">親</span></div>
        <div class="pts"><b id="myScore">0</b>点 <span class="koi-badge" id="myKoi">こいこい中</span></div>
      </div>
      <div class="hint" id="hint"></div>
      <div class="yaku-now" id="myYaku"></div>
    </div>

    <div class="hand" id="myHand"></div>
  </section>

  <!-- バナー・モーダル -->
  <div class="banner" id="banner"></div>
  <div class="modal-back" id="modalBack">
    <div class="modal" id="modal"></div>
  </div>

  <script src="js/engine.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/art.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
